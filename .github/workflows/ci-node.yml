# CI for Node projects: npm ci, typecheck, lint, test.
# Gitleaks is separate (gitleaks.yml); callers run both.
# The caller's package.json must define the scripts typecheck, lint and test,
# and the repo must commit package-lock.json.
name: ci-node

on:
  workflow_call:
    inputs:
      node_version:
        description: Exact Node.js version, e.g. 22.11.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
